<!DOCTYPE html>
<html>
<head>
    <title>Form Penyewaan Mobil</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f6f9;
        }

        .header {
            background: #2c5d73;
            color: #ffd54f;
            padding: 20px 40px;
            font-size: 32px;
            font-weight: bold;
        }

        .container {
            width: 600px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        h2 {
            color: #444;
            margin-bottom: 25px;
        }

        label {
            font-weight: bold;
            color: #333;
        }

        select, input {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        button {
            background: #2c5d73;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #214656;
        }

        .info {
            background: #eef6fa;
            border-left: 4px solid #2c5d73;
            padding: 12px;
            margin-bottom: 20px;
            color: #444;
        }
    </style>
</head>
<body>

    <div class="header">
        Rental Mobil
    </div>

    <div class="container">
        <h2>Form Penyewaan Mobil</h2>

        <div class="info">
            Silakan pilih mobil dan tentukan tanggal penyewaan.
        </div>

        <form method="post">
            {% csrf_token %}

            <label>Pilih Mobil</label>
            <select name="mobil" required>
                {% for mobil in mobils %}
                    <option value="{{ mobil.id }}">
                        {{ mobil.nama_mobil }} - Rp {{ mobil.harga_harian }}/hari
                    </option>
                {% endfor %}
            </select>

            <label>Tanggal Sewa</label>
            <input type="date" name="tanggal_sewa" required>

            <label>Tanggal Kembali</label>
            <input type="date" name="tanggal_kembali" required>

            <button type="submit">Ajukan Penyewaan</button>
        </form>
    </div>

</body>
</html>
