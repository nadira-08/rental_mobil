<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Pelanggan</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#f4f6f9;
        }

        .header{
            background:#2c5d73;
            color:#ffd54f;
            padding:20px 40px;
            font-size:32px;
            font-weight:bold;
        }

        .container{
            width:90%;
            margin:30px auto;
        }

        .welcome{
            background:white;
            padding:25px;
            border-radius:8px;
            box-shadow:0 2px 8px rgba(0,0,0,.15);
            margin-bottom:25px;
        }

        .welcome h2{
            color:#2c5d73;
            margin-bottom:10px;
        }

        .menu{
            display:grid;
            grid-template-columns:repeat(2,1fr);
            gap:20px;
        }

        .card{
            background:white;
            border-radius:8px;
            padding:25px;
            text-align:center;
            box-shadow:0 2px 8px rgba(0,0,0,.15);
            transition:.3s;
        }

        .card:hover{
            transform:translateY(-5px);
        }

        .card h3{
            color:#2c5d73;
            margin-bottom:15px;
        }

        .btn{
            display:inline-block;
            padding:10px 18px;
            background:#2c5d73;
            color:white;
            text-decoration:none;
            border-radius:5px;
        }

        .btn:hover{
            background:#214656;
        }
    </style>

</head>
<body>

<div class="header">
    Rental Mobil
</div>

<div class="container">

    <div class="welcome">
        <h2>Selamat Datang, {{ request.user.username }}</h2>
        <p>Silakan pilih menu di bawah ini.</p>
    </div>

    <div class="menu">

        <div class="card">
            <h3>🚗 Daftar Mobil</h3>
            <p>Lihat semua mobil yang tersedia.</p><br>

            <a href="/pelanggan/mobil/" class="btn">
                Buka
            </a>
        </div>

        <div class="card">
            <h3>📝 Sewa Mobil</h3>
            <p>Ajukan penyewaan mobil.</p><br>

            <a href="/pelanggan/sewa/" class="btn">
                Sewa
            </a>
        </div>

        <div class="card">
            <h3>📋 Riwayat Penyewaan</h3>
            <p>Lihat semua riwayat penyewaan.</p><br>

            <a href="/pelanggan/riwayat/" class="btn">
                Lihat
            </a>
        </div>

        <div class="card">
            <h3>🚪 Logout</h3>
            <p>Keluar dari aplikasi.</p><br>

            <a href="/logout/" class="btn">
                Logout
            </a>
        </div>

    </div>

</div>

</body>
</html>
